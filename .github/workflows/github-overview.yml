name: Update GitHub Overview

on:
  schedule:
    - cron: "20 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  overview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate GitHub Overview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: montasir132
          GITHUB_EMAIL: montasiralam132@gmail.com
        run: node scripts/generate-overview.mjs

      - name: Update Output Branch
        run: |
          git fetch origin output:output

          git checkout output

          cp generated/overview.svg overview.svg

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add overview.svg

          if git diff --cached --quiet; then
            echo "No changes to overview.svg"
          else
            git commit -m "Update GitHub overview"
            git push origin output
          fi