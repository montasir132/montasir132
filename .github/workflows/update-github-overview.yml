name: Update GitHub Overview

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  overview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate GitHub Overview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: montasir132
          GITHUB_EMAIL: montasiralam132@gmail.com
        run: node scripts/generate-overview.mjs

      # IMPORTANT: no force_orphan.
      # keep_files preserves existing Snake files on output branch.
      - name: Publish Overview and preserve Snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./generated
          keep_files: true
