name: Update Language Statistics

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24


      - name: Generate Language Statistics
        env:
          GITHUB_USERNAME: montasir132
        run: |
          node scripts/generate-languages.mjs


      - name: Update Output Branch
        run: |

          git fetch origin output:output

          git switch output

          cp generated/languages.svg ./languages.svg

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add languages.svg

          if git diff --cached --quiet; then

            echo "No changes to languages.svg"

          else

            git commit -m "Update language statistics"

            git push origin output

          fi